name: Release Please

# The changelog is not written by hand: release-please derives it from the
# commit messages, which this repo already writes in Conventional Commits with
# the package as the scope (`feat(plugin):`, `fix(backend):`). A CHANGELOG.md
# written by hand is a file that gets updated whenever somebody remembers; this
# one cannot diverge from the history because it IS the history.
#
# HOW IT WORKS, in two acts. Every push to `main` recomputes which version each
# package would be due and leaves ONE pull request open with the three
# CHANGELOG.md and the three `package.json` already bumped. That pull request
# stays there, and updates itself with every push, until a person merges it:
# that merge is the one that creates the tags and the GitHub releases.
# Publishing is still a human decision, like the loop's other three gates.
#
# THREE PACKAGES, THREE VERSIONS. `plugin/` is the only thing that gets
# distributed and its version travels in the telemetry of every run
# (`plugin_version`), so it cannot move because somebody touched the frontend.
# `backend/` and `frontend/` carry their own. release-please sorts every commit
# by the FILES it touches, not by the scope of the message, so a commit that
# crosses two packages comes out in both changelogs, which is the correct
# thing: it changed both.
#
# ONE SINGLE PULL REQUEST for the three of them
# (`separate-pull-requests: false`), and three releases when it is merged, one
# per package that has changed. With one pull request per package the release
# queue would compete with the work queue.
#
# WHY THIS PULL REQUEST ARRIVES WITH NO CHECKS, AND WHAT TO DO ABOUT IT.
# Measured on 2026-09-20, because what this comment said before was wrong in a
# way that mattered: it said CI does not run over the release pull request. CI
# is triggered. What happens is that a run triggered by an event the default
# `GITHUB_TOKEN` created is HELD at `action_required` until a person approves
# it — and `gh pr checks` reports nothing at all for a run in that state, which
# is exactly what "no checks" looked like from outside.
#
# That was harmless while nothing was required. Since `ci` became a required
# check of `main`, a held run means this pull request cannot merge at all.
#
# The unblock is one command, on the run of its current head:
#
#   id=$(gh api repos/<owner>/<repo>/actions/runs \
#     --jq '[.workflow_runs[]|select(.head_branch=="release-please--branches--main"
#            and .conclusion=="action_required")][0].id')
#   gh api --method POST repos/<owner>/<repo>/actions/runs/$id/approve
#
# Watched working: the run went from `action_required` to `queued`, finished
# green, and the pull request merged through the queue.
#
# Two things that do NOT solve it, both tried. Closing and reopening the pull
# request does trigger a run that is not held — a person reopened it — but it
# only lasts until the next push to `main`, because release-please updates the
# pull request, that is a new head, and the new run is held again. And the merge
# queue does not exempt it: enqueueing without `ci` is refused with
# `Required status check "ci" is expected`. The queue evaluates the checks on
# the merge group AS WELL, not INSTEAD.
#
# The durable fix is the one this comment always named, and it is a decision
# with a price rather than a task: create a PAT with `contents: write` and
# `pull-requests: write`, keep it as a secret and add
# `token: ${{ secrets.RELEASE_PLEASE_TOKEN }}` to the step below. The pull
# request is then authored by a user, no run of its is ever held, and nothing
# else needs touching. The price is a long-lived credential in a public
# repository, which is why it has not been done by whoever wrote this line.

on:
  push:
    branches: [main]

# No permissions by default: the job that needs them asks for them, and only
# those. Same criterion as continuous-integration.yml.
permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Pinned by SHA and with the version beside it, like the four actions of
      # continuous-integration.yml: a tag can be moved, a SHA cannot.
      - name: Release Please
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
